<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dsh-qa-bot — Autonomous QA Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22d3a6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1060" cy="40" r="190" fill="#4f8cff" opacity="0.09"/>
  <circle cx="120" cy="300" r="170" fill="#22d3a6" opacity="0.07"/>

  <text x="72" y="128" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">dsh-qa-bot</text>
  <text x="74" y="174" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#9fb3d9">Autonomous QA Engineer for DeepSeek Harness</text>
  <text x="74" y="212" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="18" fill="#6f84ad">briefing · evidência · correção · regressão</text>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" font-weight="600">
    <rect x="74" y="242" width="92" height="34" rx="17" fill="#16244a" stroke="#2b4272"/>
    <text x="120" y="264" text-anchor="middle" fill="#8fb4ff">skill</text>
    <rect x="178" y="242" width="104" height="34" rx="17" fill="#16244a" stroke="#2b4272"/>
    <text x="230" y="264" text-anchor="middle" fill="#8fb4ff">preset</text>
    <rect x="294" y="242" width="82" height="34" rx="17" fill="#16244a" stroke="#2b4272"/>
    <text x="335" y="264" text-anchor="middle" fill="#8fb4ff">bot</text>
  </g>

  <g>
    <rect x="792" y="64" width="336" height="196" rx="18" fill="#0d1730" stroke="#283c69"/>
    <rect x="792" y="64" width="336" height="38" rx="18" fill="#122043"/>
    <rect x="792" y="86" width="336" height="16" fill="#122043"/>
    <circle cx="816" cy="83" r="5" fill="#ff6b6b"/>
    <circle cx="834" cy="83" r="5" fill="#ffd166"/>
    <circle cx="852" cy="83" r="5" fill="#22d3a6"/>
    <text x="808" y="128" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#7dd3fc">qa/BUGS.md</text>
    <g fill="#22d3a6">
      <circle cx="812" cy="152" r="6"/>
      <circle cx="812" cy="180" r="6"/>
      <circle cx="812" cy="208" r="6"/>
    </g>
    <g fill="#ffffff" opacity="0.85" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14">
      <text x="830" y="157">repro + screenshot</text>
      <text x="830" y="185">API + log + trace</text>
      <text x="830" y="213">causa raiz + arquivo</text>
    </g>
    <rect x="978" y="228" width="122" height="26" rx="13" fill="#0f3a2f" stroke="#22d3a6"/>
    <text x="1039" y="246" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3a6">VERIFIED</text>
  </g>

  <rect x="72" y="300" width="1056" height="2" rx="1" fill="url(#accent)" opacity="0.55"/>
