<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsh-qa smoke</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 .25rem; }
    input, button { font: inherit; padding: .5rem; }
    #out { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="title">QA smoke fixture</h1>
  <p>Página local usada pelo <code>scripts/smoke.ps1</code> para validar o agent-browser.</p>

  <label for="name">Nome</label>
  <input id="name" autocomplete="off">

  <button id="greet" type="button">Saudar</button>
  <p id="out">—</p>

  <script>
    document.querySelector('#greet').addEventListener('click', () => {
      const name = document.querySelector('#name').value.trim() || 'mundo'
      document.querySelector('#out').textContent = 'Olá, ' + name
    })
  </script>
</body>
</html>
